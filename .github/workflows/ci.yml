name: Validate pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '24.10.5'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Workflow wiring with original manifest basename
        run: |
          cp assets/samplesheet.example.csv /tmp/samplesheet.csv
          nextflow run . --input /tmp/samplesheet.csv --outdir test-results -stub-run -ansi-log false
          python3 - <<'PY'
          import json
          from pathlib import Path
          qc = json.loads(Path('test-results/cohort_qc.json').read_text())
          assert qc['manifest_samples'] == 2
          assert qc['sample_locus_rows'] == 8
          assert qc['stub_run'] is True
          PY

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '24.10.5'
      - name: Verify container, installation and indexed BAM extraction
        run: |
          docker run --rm -v "$PWD:/pipeline" -v "$PWD:$PWD" -e IMMUNELENS_CI_ROOT="$PWD" -w /pipeline \
            community.wave.seqera.io/library/r-base_samtools_awscli_python_pruned@sha256:b0bf56a001057922cea8f352bb6ec91d6891660515212f089e9683bc65f5115e \
            bash -euo pipefail -c '
              python3 -m unittest discover -s tests -v
              mkdir -p /tmp/software-check
              cd /tmp/software-check
              /pipeline/bin/prepare_immunelens.sh
              export R_LIBS_USER="$PWD/immunelens-library"
              Rscript -e '\''library(ImmuneLENS); stopifnot(packageVersion("ImmuneLENS") == "1.0.3"); stopifnot(requireNamespace("jsonlite")); cat("Runtime verified\n")'\''
              python3 /pipeline/tests/make_smoke_fixture.py regions.tsv "$IMMUNELENS_CI_ROOT/.runtime-smoke"
              python3 /pipeline/tests/public_demo.py /tmp/public-demo
            '
      - name: Real Nextflow Docker execution with Fusion and Wave disabled
        run: |
          nextflow run . -profile docker,seqera --input "$PWD/.runtime-smoke/samplesheet.csv" \
            --outdir test-results -ansi-log false
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          qc = json.loads(Path('test-results/cohort_qc.json').read_text())
          assert qc['manifest_samples'] == 2
          assert qc['sample_locus_rows'] == 8
          assert qc['stub_run'] is False
          assert qc['correction_counts'] == {'purity_local_cn': 7, 'unadjusted': 1}
          with open('test-results/cohort_estimates.tsv') as handle:
              rows = list(csv.DictReader(handle, delimiter='\t'))
          assert all(row['status'] == 'no_coverage' for row in rows if row['sample'] == 'EMPTY')
          assert all(row['cell_fraction'] == 'NA' for row in rows)
          assert json.loads(Path('test-results/coverage/LOWCOV.normal.coverage/sample.json').read_text())['coverage_positions'] == {'IGH': 0}
          assert json.loads(Path('test-results/coverage/EMPTY.normal.coverage/sample.json').read_text())['provided'] is False
          assert qc['igh_correction_counts'] == {'not_provided': 1, 'not_run': 1}
          PY
